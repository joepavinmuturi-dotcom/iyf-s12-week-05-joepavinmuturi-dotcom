<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <style>
        .highlight { background-color: yellow; }
        .container { padding: 20px; border: 1px solid #ccc; }
        .hidden { display: none; }
        .accent { color: #8e2a5b; }
        .completed { text-decoration: line-through; color: gray; }
        .error { border: 2px solid red; }
        .error-msg { color: red; display: block; }
        #grandparent, #parent, #child { padding: 12px; margin: 6px; border: 1px solid #999; }
    </style>
</head>
<body>
    <header id="main-header">
        <h1>Mystical programmers</h1>
        <nav>
            <ul class="nav-list">
                <li><a href="#" class="nav-link">Home</a></li>
                <li><a href="#" class="nav-link">About</a></li>
                <li><a href="#" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <article data-id="42" data-category="tech">
            <h2 class="title">Our article</h2>
            <p class="content"> first paragraph.</p>
            <p class="content">This is the second paragraph.</p>
        </article>

        <section>
            <h2>Form Section</h2>
            <form id="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Amina">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@gmail.com">
                <button type="submit">Submit</button>
            </form>
        </section>

        <section id="injection-demo">
            <h2>Injection demo</h2>
            <div id="unsafe"></div>
            <div id="safe"></div>
        </section>
                <section id="counter-demo">
            <h2>Click counter</h2>
            <p>Count: <span id="count">0</span></p>
            <button type="button" id="plus">+</button>
            <button type="button" id="minus">-</button>
            <button type="button" id="reset">Reset</button>
        </section>

        <section id="bubbling-demo">
            <h2>Event bubbling</h2>
            <div id="grandparent">Grandparent
                <div id="parent">Parent
                    <div id="child">Child</div>
                </div>
            </div>
        </section>

        <section id="task-demo">
            <h2>Delegated task list</h2>
            <form id="task-form">
                <input type="text" id="task-input" placeholder="New task">
                <button type="submit">Add</button>
            </form>
            <ul id="task-list">
                <li><span>Learn the DOM</span> <button type="button" class="delete">Delete</button></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026</p>
    </footer>

    <script src="dom.js"></script>
</body>
</html>
